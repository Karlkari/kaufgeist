<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaufgeist – Dein intelligenter KI-Einkaufsberater</title>
    
    <!-- Inline-SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        /* Sanftes Scrollen für den Chat-Container */
        #chatContainer {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-ghost text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Kaufgeist<span class="text-indigo-400">.de</span></h1>
                    <p class="text-xs text-slate-400">Kostenlose & neutrale KI-Kaufberatung im Chat</p>
                </div>
            </div>
            <button onclick="resetChat()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Neuer Chat
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- Hero Section -->
        <section id="heroSection" class="text-center space-y-4 py-2">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                Was möchtest du heute kaufen?
            </h2>
            <p class="text-slate-400 text-xs sm:text-sm max-w-lg mx-auto">
                Beschreibe dein Wunschprodukt oder dein Budget. Der Kaufgeist findet neutral die besten Angebote für dich.
            </p>

            <!-- Erstes Hero-Eingabefeld (Mobil optimiert & responsiv) -->
            <div id="heroInputBox" class="max-w-2xl mx-auto mt-4 p-2 bg-slate-900 border-2 border-indigo-400 rounded-2xl shadow-[0_0_25px_rgba(99,102,241,0.25)] focus-within:border-indigo-300 focus-within:ring-4 focus-within:ring-indigo-500/40 transition-all">
                <div class="flex flex-col sm:flex-row gap-2 w-full">
                    <input type="text" id="heroInput" placeholder="Z. B. Laptop unter 500€ für Office..." 
                        onkeypress="if(event.key === 'Enter') sendFirstMessage()"
                        class="w-full sm:flex-grow bg-slate-900 border-none rounded-xl px-4 py-3.5 text-base focus:outline-none text-white placeholder-slate-400 font-medium">
                    <button onclick="sendFirstMessage()" class="w-full sm:w-auto shrink-0 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-indigo-600/40">
                        <span>Beraten</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Vorschläge -->
            <div id="quickTags" class="pt-2 flex flex-wrap justify-center gap-2 text-xs text-slate-400">
                <span class="text-slate-500 self-center">Beispiele:</span>
                <button onclick="quickSearch('Laptop unter 300 Euro für Mails & Videos')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition">💻 Laptop unter 300€</button>
                <button onclick="quickSearch('Kaffeevollautomat unter 400 Euro')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition">☕ Kaffeevollautomat</button>
                <button onclick="quickSearch('Saugroboter leise für Tierhaare')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition">🧹 Saugroboter</button>
            </div>
        </section>

        <!-- Chat History Window -->
        <section id="chatContainer" class="flex-grow space-y-4 overflow-y-auto pb-4">
        </section>

        <!-- Unteres Sticky-Eingabefeld -->
        <section id="stickyInputSection" class="hidden sticky bottom-4 z-40 bg-slate-900 border-2 border-indigo-400/90 focus-within:border-indigo-300 focus-within:ring-4 focus-within:ring-indigo-500/30 rounded-2xl p-2 shadow-[0_0_20px_rgba(0,0,0,0.5)] transition-all">
            <div class="flex gap-2">
                <input type="text" id="userInput" placeholder="Rückfrage stellen oder Alternativen anfordern..." 
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                    class="flex-grow bg-slate-900 border-none rounded-xl px-4 py-3 text-sm focus:outline-none text-white placeholder-slate-400 font-medium">
                <button onclick="sendMessage()" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 text-slate-500 text-xs py-4">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center text-slate-500">
            <p>© 2026 Kaufgeist.de – Unabhängiges Testprojekt.</p>
            <p>Interaktiver Chat-Modus</p>
        </div>
    </footer>

    <!-- Script Area -->
    <script>
        let chatHistory = [];

        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        function sendFirstMessage() {
            const heroInput = document.getElementById('heroInput');
            const text = heroInput.value.trim();
            if (!text) return;

            document.getElementById('heroInputBox').classList.add('hidden');
            document.getElementById('quickTags').classList.add('hidden');
            document.getElementById('stickyInputSection').classList.remove('hidden');

            processSearch(text);
        }

        function sendMessage() {
            const userInput = document.getElementById('userInput');
            const text = userInput.value.trim();
            if (!text) return;

            processSearch(text);
            userInput.value = '';
        }

        function quickSearch(query) {
            document.getElementById('heroInputBox').classList.add('hidden');
            document.getElementById('quickTags').classList.add('hidden');
            document.getElementById('stickyInputSection').classList.remove('hidden');

            processSearch(query);
        }

        function resetChat() {
            chatHistory = [];
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';
            
            document.getElementById('heroInputBox').classList.remove('hidden');
            document.getElementById('quickTags').classList.remove('hidden');
            document.getElementById('stickyInputSection').classList.add('hidden');
            document.getElementById('heroInput').value = '';
        }

        async function processSearch(text) {
            const chatContainer = document.getElementById('chatContainer');

            // 1. User-Nachricht anzeigen
            chatContainer.innerHTML += `
                <div class="flex items-end justify-end gap-3">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none p-4 max-w-xl text-sm shadow-md">
                        ${text}
                    </div>
                </div>
            `;

            chatHistory.push({ role: 'user', content: text });
            setTimeout(scrollToBottom, 50);

            // 2. Lade-Indikator
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="bg-indigo-600 p-2 rounded-xl text-white text-xs mt-1">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl rounded-tl-none p-4 text-sm text-slate-400 shadow-md">
                        <i class="fa-solid fa-spinner fa-spin mr-2"></i> Kaufgeist analysiert deine Anfrage...
                    </div>
                </div>
            `;
            setTimeout(scrollToBottom, 50);

            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.error) {
                    chatContainer.innerHTML += `
                        <div class="flex items-start gap-3">
                            <div class="bg-rose-600 p-2 rounded-xl text-white text-xs mt-1">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <div class="bg-rose-950/40 border border-rose-800/50 rounded-2xl rounded-tl-none p-4 text-sm text-rose-300">
                                ${data.error}
                            </div>
                        </div>
                    `;
                    setTimeout(scrollToBottom, 50);
                    return;
                }

                chatHistory.push({ role: 'assistant', content: data.reply });

                // 3. Produktkarten rendern (falls Produkte vorhanden sind)
                let productsHtml = '';
                if (data.products && data.products.length > 0) {
                    const limitedProducts = data.products.slice(0, 3);
                    
                    productsHtml = `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4 w-full">
                            ${limitedProducts.map(p => {
                                return `
                                <div class="bg-slate-900 border border-slate-700/80 rounded-xl p-4 flex flex-col justify-between hover:border-indigo-500/50 transition shadow-md gap-3">
                                    <div>
                                        <div class="flex justify-between items-start gap-2 mb-2">
                                            <h4 class="font-bold text-white text-xs sm:text-sm leading-snug line-clamp-2">${p.name}</h4>
                                            <span class="bg-indigo-950 text-indigo-300 text-[10px] px-2 py-0.5 rounded font-semibold border border-indigo-800/40 whitespace-nowrap">★ ${p.rating}</span>
                                        </div>
                                        
                                        ${p.targetGroup ? `
                                            <div class="mb-2 text-[11px] bg-indigo-950/50 text-indigo-200 border border-indigo-800/30 px-2 py-1 rounded">
                                                <i class="fa-solid fa-user-check mr-1 text-indigo-400"></i>${p.targetGroup}
                                            </div>
                                        ` : ''}

                                        <div class="text-[11px] space-y-1.5 my-2 bg-slate-950/60 p-2.5 rounded border border-slate-800/60">
                                            <p class="text-emerald-400 leading-snug"><i class="fa-solid fa-check text-[9px] mr-1"></i>${p.pros}</p>
                                            <p class="text-rose-400 leading-snug"><i class="fa-solid fa-xmark text-[9px] mr-1"></i>${p.cons}</p>
                                        </div>
                                    </div>

                                    <div class="pt-2 border-t border-slate-800 flex flex-col gap-2">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] text-slate-400">Tagespreis</span>
                                            <span class="text-sm font-extrabold text-white">${p.price}</span>
                                        </div>
                                        <a href="${p.directUrl}" target="_blank" rel="noopener noreferrer" 
                                           class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5 shadow-md shadow-indigo-600/20 text-center">
                                            <span>Bei Amazon ansehen</span>
                                            <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                        </a>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }

                // 4. KI-Antwort im Chat rendern
                chatContainer.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-indigo-600 p-2 rounded-xl text-white text-xs mt-1 shadow-lg shadow-indigo-600/30">
                            <i class="fa-solid fa-ghost"></i>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl rounded-tl-none p-4 max-w-4xl text-sm leading-relaxed shadow-md space-y-3 w-full">
                            <div class="text-slate-200 leading-relaxed space-y-2 [&>ul]:list-disc [&>ul]:pl-5 [&>ul]:space-y-1 [&>p]:mb-2">
                                ${marked.parse(data.reply)}
                            </div>
                            ${productsHtml}
                        </div>
                    </div>
                `;

                setTimeout(scrollToBottom, 50);
                setTimeout(scrollToBottom, 300);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatContainer.innerHTML += `
                    <div class="text-xs text-rose-400 p-2">Fehler bei der Verbindung. Bitte erneut versuchen.</div>
                `;
                setTimeout(scrollToBottom, 50);
            }
        }
    </script>
</body>
</html>
